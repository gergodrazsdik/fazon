<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>a11y: a dialog whose roles and names come from where its spec says</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #1c1f25;
        font-family: system-ui, sans-serif;

        border-radius: 6px;
      }
      .dialog h2 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .dialog p {
        margin: 0 0 8px;
      }
      .close {
        min-width: 32px;
        min-height: 32px;
