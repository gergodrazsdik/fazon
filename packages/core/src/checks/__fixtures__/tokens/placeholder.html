<!-- fazon-fixture: check=tokens expect=user-agent -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tokens: a text field whose placeholder keeps the browser's colour</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      .field {
        display: inline-block;
      }
      .input {
        margin: 0;
        padding: var(--space-inset-sm);
        border: 0 solid transparent;
        border-radius: var(--radius-control);
        background-color: var(--color-surface-base);
        color: var(--color-text-primary);
        font: inherit;
        letter-spacing: normal;
      }
    </style>
  </head>
  <body>
    <div data-fazon-frame>
      <span class="field" data-part="TextField"
        ><input class="input" aria-label="Email" placeholder="name@example.com"
      /></span>
    </div>
  </body>
</html>
