<!-- fazon-fixture: check=tokens expect=pass -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tokens: pseudo-elements that don't render: no content, no box, a placeholder that isn't shown</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      .field {
        display: inline-block;
      }
      .input {
        margin: 0;
        padding: var(--space-inset-sm);
        border: 0 solid transparent;
        border-radius: var(--radius-control);
        background-color: var(--color-surface-base);
        color: var(--color-text-primary);
        font: inherit;
        letter-spacing: normal;
      }
      /* No content: neither renders. */
      .field::before {
        background-color: #ff0000;
      }
      .field::after {
        content: none;
        background-color: #ff0000;
      }
      /* Content, but no box. */
      .wrap::before {
        content: "*";
        display: none;
        color: #ff0000;
      }
      /* The input has a value, so its placeholder isn't shown. */
      .input::placeholder {
        color: #ff0000;
      }
    </style>
  </head>
  <body>
    <div data-fazon-frame>
      <span class="field" data-part="TextField"
        ><span class="wrap"
          ><input class="input" aria-label="Email" placeholder="name@example.com" value="ada@example.com" /></span
      ></span>
    </div>
  </body>
</html>
