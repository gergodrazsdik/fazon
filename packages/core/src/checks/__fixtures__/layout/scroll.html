<!-- fazon-fixture: check=layout expect=scroll -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>layout: a panel whose text scrolls</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 16px;
        line-height: 24px;
      }
      [data-fazon-frame] {
        display: inline-block;
        padding: 16px;
      }
      .panel {
        width: 160px;
        height: 48px;
        overflow: auto;
      }
      .panel p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div data-fazon-frame>
      <div class="panel" data-part="Panel">
        <p>A long paragraph of text that needs more than two lines in a narrow panel.</p>
      </div>
    </div>
  </body>
</html>
