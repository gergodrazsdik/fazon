<!-- fazon-fixture: check=layout expect=pass -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>layout: two small icon buttons spaced 24 px apart, and a link in a sentence</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        line-height: 20px;
      }
      [data-fazon-frame] {
        display: inline-block;
        padding: 16px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
      }
      .icon {
        display: block;
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        background: #1f4fd1;
      }
      p {
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <div data-fazon-frame>
      <div class="toolbar" data-part="Toolbar">
        <button class="icon" type="button" aria-label="Bold" data-part="Item"></button>
        <button class="icon" type="button" aria-label="Italic" data-part="Item"></button>
        <p data-part="Hint">Read <a href="#formatting">the formatting guide</a> first.</p>
      </div>
    </div>
  </body>
</html>
