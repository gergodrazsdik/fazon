<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>verifier smoke test: the generic font families</title>
<style>
body { margin: 0; padding: 16px; background: #ffffff; color: #000000; font-size: 16px; line-height: 24px; }
p { margin: 0 0 8px; }
</style>
</head>
<body>
<p id="system-ui" style="font-family: system-ui">system-ui: The quick brown fox jumps over the lazy dog. 0123456789</p>
<p id="sans-serif" style="font-family: sans-serif">sans-serif: The quick brown fox jumps over the lazy dog. 0123456789</p>
<p id="serif" style="font-family: serif">serif: The quick brown fox jumps over the lazy dog. 0123456789</p>
<p id="monospace" style="font-family: monospace">monospace: The quick brown fox jumps over the lazy dog. 0123456789</p>
<button id="button" type="button">button: the browser's own font</button>
</body>
</html>
