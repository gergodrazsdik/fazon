# The workflow `fazon init` writes into a consumer repository, as .github/workflows/fazon.yml.
# Before M5 the reusable workflow is referenced by the framework commit the repository pins;
# from M5, by a release tag. A repository whose install needs more than
# `pnpm install --frozen-lockfile` passes `install-command` under `with:` (docs/spec/workflow.md#installing).
# The judge uses workload identity federation; a repository without it drops `id-token: write`
# and the `anthropic-*` inputs, and passes the `anthropic-api-key` secret (docs/spec/workflow.md#credentials).
---
name: fazon

on:
  pull_request:

permissions: {}

concurrency:
  group: fazon-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fazon:
    uses: gergodrazsdik/fazon/.github/workflows/verify.yml@0123456789abcdef0123456789abcdef01234567
    permissions:
      contents: read
      id-token: write # only the judge job uses it
      pull-requests: write # only the comment job uses it
    with:
      anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
