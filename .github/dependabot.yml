---
# New releases wait 7 days before Dependabot proposes them, as pnpm's
# minimumReleaseAge does. The linters pinned in scripts/install-ci-tools.sh
# and lint.yml are outside Dependabot's reach: `just tool-updates` reports them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels: ["dependencies", "area: ci"]
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels: ["dependencies"]
    ignore:
      # TypeScript 7.0 ships no JavaScript API, which typescript-eslint, vue-tsc and
      # vue-component-meta need. The move to 7.1 is a tracker task (T-0091), not an update.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
  # The verifier image's base (Playwright's image, pinned by digest). Its Playwright version must
  # match the framework's playwright-core pin, so these updates go together with that one.
  - package-ecosystem: docker
    directory: /verifier
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels: ["dependencies", "area: verifier"]
