---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The exact pnpm version package.json's packageManager names; no third-party setup action.
      - name: Install pnpm
        run: npm install -g "pnpm@$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)"  # zizmor: ignore[adhoc-packages]
      - name: Install the dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Lint (ESLint)
        run: pnpm run lint
      - name: Format check (Prettier)
        run: pnpm run format:check
      - name: Test
        run: pnpm test
