---
# The reusable workflow a consumer repository calls on every pull request (docs/spec/workflow.md,
# ADR 0017). `verify` is the required check: it runs `fazon verify` on the runner, which starts the
# pinned verifier image as on a laptop, writes the summary and uploads the artifacts. `judge` runs
# `fazon judge` on the runner and adds its verdicts to them. `comment` posts the summary on pull
# requests from the same repository. Nothing here writes code, baselines or commits (WF-001).
name: fazon

on:
  workflow_call:
    inputs:
      working-directory:
        description: Where fazon.yaml and package.json are, from the repository's root.
        type: string
        default: "."
      node-version-file:
        description: The file that names the Node.js version to install, from the repository's root.
        type: string
        default: .node-version
      install-command:
        description: >-
          The command that installs the dependencies, run with bash in the working directory after
          pnpm is installed at the version package.json's packageManager names.
        type: string
        default: pnpm install --frozen-lockfile
      artifact-retention-days:
        description: How long the artifacts are kept, in days.
        type: number
        default: 14
      timeout-minutes:
        description: The verify job's limit; the judge job has half of it.
        type: number
        default: 30
      anthropic-federation-rule-id:
        description: >-
          The workload identity federation rule's ID; when it's set, the judge job uses federation
          instead of the API key (docs/spec/workflow.md#credentials). Not a secret.
        type: string
        default: ""
      anthropic-organization-id:
        description: The organization's ID; required with a federation rule.
        type: string
        default: ""
      anthropic-service-account-id:
        description: The service account's ID; required with a federation rule.
        type: string
        default: ""
      anthropic-workspace-id:
        description: The workspace's ID; needed only when the rule covers more than one workspace.
        type: string
        default: ""
    secrets:
      anthropic-api-key:
        description: >-
          The judge's API key, for the judge job only, when no federation rule is set. Without
          either, the judge is skipped.
        required: false
    outputs:
      status:
        description: "The verify job's status: ok, failed or error."
        value: ${{ jobs.verify.outputs.status }}

permissions: {}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      FAZON: node_modules/.bin/fazon
    outputs:
      status: ${{ steps.status.outputs.status }}
      run: ${{ steps.verify.outputs.run }}
      judge: ${{ steps.verify.outputs.judge }}
      judge-timeout: ${{ steps.status.outputs.judge-timeout }}
      report-url: ${{ steps.report.outputs.artifact-url }}
    steps:
      # With its history, so `fazon verify --base` can compare the baselines with the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      # The exact pnpm version package.json's packageManager names; no third-party setup action.
      - name: Install pnpm
        run: |  # zizmor: ignore[adhoc-packages]
          manager=""
          if [ -f package.json ]; then manager=$(jq -r '.packageManager // ""' package.json); fi
          case "$manager" in
            pnpm@*)
              version=${manager#pnpm@}
              npm install -g "pnpm@${version%%+*}"
              ;;
            *) echo "package.json names no pnpm version; the install command brings its own tools." ;;
          esac
      - name: Install the dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"
      - name: fazon doctor
        id: doctor
        run: '"$FAZON" doctor'
      - name: fazon spec check
        id: spec
        if: ${{ !cancelled() && steps.doctor.outcome == 'success' }}
        run: '"$FAZON" spec check'
      - name: fazon sync --check
        id: sync
        if: ${{ !cancelled() && steps.doctor.outcome == 'success' }}
        run: '"$FAZON" sync --check'
      - name: fazon verify
        id: verify
        if: ${{ !cancelled() && steps.doctor.outcome == 'success' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          result="$RUNNER_TEMP/fazon-verify.json"
          args=(verify --no-judge --json --verbose)
          if [ -n "$BASE_REF" ]; then args+=(--base "origin/$BASE_REF"); fi
          code=0
          "$FAZON" "${args[@]}" >"$result" || code=$?
          jq -r '.messages[] | "\(.level): \(.text)"' "$result" || true
          run=$(jq -r '.result.run // ""' "$result" || true)
          if ! [[ "$run" =~ ^[0-9]{8}T[0-9]{6}Z-[a-z][a-z0-9-]*-[0-9a-f]{4}$ ]]; then run=""; fi
          judge=$(jq -r 'if (.result.judge.policy // "off") != "off" then "run" else "skip" end' "$result" || echo skip)
          {
            echo "status=$(jq -r '.status // "error"' "$result" || echo error)"
            echo "run=$run"
            echo "judge=$judge"
          } >>"$GITHUB_OUTPUT"
          exit "$code"
      # ok, failed (a check or validation failed) or error (the environment or the tool failed).
      - name: Status
        id: status
        if: ${{ !cancelled() }}
        env:
          VERIFY: ${{ steps.verify.outputs.status }}
          SPEC: ${{ steps.spec.outcome }}
          SYNC: ${{ steps.sync.outcome }}
          TIMEOUT: ${{ inputs.timeout-minutes }}
        run: |
          case "$VERIFY" in
            ok | failed | error) status=$VERIFY ;;
            refused) status=failed ;;
            *) status=error ;;
          esac
          if [ "$status" = ok ] && { [ "$SPEC" = failure ] || [ "$SYNC" = failure ]; }; then status=failed; fi
          {
            echo "status=$status"
            echo "judge-timeout=$(( TIMEOUT / 2 > 0 ? TIMEOUT / 2 : 1 ))"
          } >>"$GITHUB_OUTPUT"
      - name: Upload the Storybook build
        id: storybook
        if: ${{ !cancelled() && steps.verify.outputs.run != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fazon-storybook
          path: ${{ inputs.working-directory }}/.fazon/runs/${{ steps.verify.outputs.run }}/storybook/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}
      - name: Upload the packed library
        id: package
        if: ${{ !cancelled() && steps.verify.outputs.run != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fazon-package
          path: ${{ inputs.working-directory }}/.fazon/runs/${{ steps.verify.outputs.run }}/package/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}
      # The record, verify.json, captures and diff images, logs and tool reports; no transcript,
      # prompt or credential (WF-006): a verify run makes no agent call.
      - name: Upload the run
        id: run
        if: ${{ !cancelled() && steps.verify.outputs.run != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fazon-run
          path: |
            ${{ inputs.working-directory }}/.fazon/runs/${{ steps.verify.outputs.run }}/
            !${{ inputs.working-directory }}/.fazon/runs/${{ steps.verify.outputs.run }}/storybook/
            !${{ inputs.working-directory }}/.fazon/runs/${{ steps.verify.outputs.run }}/package/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}
      # The HTML report (`fazon report`), copied beside the summary for the `fazon-report` artifact,
      # also when verify failed. After the run's upload, so `fazon-run` doesn't carry it twice. A
      # report that can't be built doesn't fail the job: the summary says so and is uploaded alone.
      - name: HTML report
        id: html
        if: ${{ !cancelled() && steps.verify.outputs.run != '' }}
        continue-on-error: true
        env:
          RUN_ID: ${{ steps.verify.outputs.run }}
        run: |
          "$FAZON" report --no-open "$RUN_ID"
          dir="$RUNNER_TEMP/fazon-report"
          mkdir -p "$dir"
          rm -rf "$dir/report"
          cp -R ".fazon/runs/$RUN_ID/report" "$dir/report"
      # `fazon report --summary`, under a heading with the job's status and any step that failed
      # outside `fazon verify`, with links to the artifacts in place of its placeholder.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.status.outputs.status }}
          RUN_ID: ${{ steps.verify.outputs.run }}
          DOCTOR: ${{ steps.doctor.outcome }}
          SPEC: ${{ steps.spec.outcome }}
          SYNC: ${{ steps.sync.outcome }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.artifact-url }}
          PACKAGE_URL: ${{ steps.package.outputs.artifact-url }}
          RUN_URL: ${{ steps.run.outputs.artifact-url }}
          HTML: ${{ steps.html.outcome }}
          RUN_PAGE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          dir="$RUNNER_TEMP/fazon-report"
          mkdir -p "$dir"
          part="$RUNNER_TEMP/fazon-summary-part.md"
          placeholder='<!-- fazon:artifacts -->'
          if [ -z "$RUN_ID" ] || ! "$FAZON" report --summary "$RUN_ID" >"$part"; then
            printf '%s\n' "### Fazon verify didn't run" "" "\`fazon verify\` made no run; the job's log says why." "" "$placeholder" >"$part"
          fi
          link() {
            if [ -n "$2" ]; then echo "- [$1]($2): $3"; fi
          }
          notes=()
          if [ "$DOCTOR" != success ]; then notes+=("- Installing the dependencies or \`fazon doctor\` failed: see the [job's log]($RUN_PAGE)."); fi
          if [ "$SPEC" = failure ]; then notes+=("- \`fazon spec check\` failed: see the [job's log]($RUN_PAGE)."); fi
          if [ "$SYNC" = failure ]; then notes+=("- \`fazon sync --check\` failed: the generated files aren't current; run \`fazon sync\`."); fi
          {
            echo "## Fazon: ${STATUS:-error}"
            echo
            if [ "${#notes[@]}" -gt 0 ]; then printf '%s\n' "${notes[@]}" ""; fi
            while IFS= read -r line; do
              if [ "$line" = "$placeholder" ]; then
                echo "#### Artifacts"
                echo
                link fazon-storybook "$STORYBOOK_URL" "the static Storybook build"
                link fazon-package "$PACKAGE_URL" "the packed library"
                link fazon-run "$RUN_URL" "the run's record, captures, diff images and logs"
                if [ "$HTML" = success ]; then
                  echo "- fazon-report: this summary and the HTML report; open \`report/index.html\` from it in a browser."
                elif [ -n "$RUN_ID" ]; then
                  echo "- fazon-report: this summary only; the HTML report couldn't be built: see the [job's log]($RUN_PAGE)."
                else
                  echo "- fazon-report: this summary."
                fi
                echo "- Every artifact is on the [workflow run's page]($RUN_PAGE)."
              else
                printf '%s\n' "$line"
              fi
            done <"$part"
          } >"$dir/summary.md"
          cat "$dir/summary.md" >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fazon-report
          path: ${{ runner.temp }}/fazon-report/
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}

  # The judge (docs/spec/workflow.md#judge): after a passing verify, for a pull request from this
  # repository, unless the judge's policy is off. A push has no pull request's stories to judge, and
  # a fork gets no credential. It gets one credential (#credentials): workload identity federation
  # when the rule input is set, the API key secret otherwise; only this job sees it (WF-002). With
  # the policy `advisory` it fails only on its own errors.
  judge:
    name: judge
    needs: verify
    if: >-
      ${{ needs.verify.outputs.status == 'ok' && needs.verify.outputs.judge == 'run'
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.verify.outputs.judge-timeout || '15') }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      FAZON: node_modules/.bin/fazon
      RUN_ID: ${{ needs.verify.outputs.run }}
    steps:
      # The baselines the change questions compare with are the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
      - name: Install pnpm
        run: |  # zizmor: ignore[adhoc-packages]
          manager=""
          if [ -f package.json ]; then manager=$(jq -r '.packageManager // ""' package.json); fi
          case "$manager" in
            pnpm@*)
              version=${manager#pnpm@}
              npm install -g "pnpm@${version%%+*}"
              ;;
            *) echo "package.json names no pnpm version; the install command brings its own tools." ;;
          esac
      - name: Install the dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"
      - name: Download the run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fazon-run
          path: ${{ inputs.working-directory }}/.fazon/runs/${{ needs.verify.outputs.run }}
      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fazon-report
          path: ${{ runner.temp }}/fazon-report
      # The identity token lasts about five minutes and is exchanged once, so with federation a
      # loop writes a fresh one every minute while `fazon judge` runs; the SDK reads the file at
      # each exchange. The token and the key are never printed (CLI-003).
      - name: fazon judge
        id: judge
        env:
          RULE_ID: ${{ inputs.anthropic-federation-rule-id }}
          ORGANIZATION_ID: ${{ inputs.anthropic-organization-id }}
          SERVICE_ACCOUNT_ID: ${{ inputs.anthropic-service-account-id }}
          WORKSPACE_ID: ${{ inputs.anthropic-workspace-id }}
          API_KEY: ${{ secrets.anthropic-api-key }}
        run: |
          result="$RUNNER_TEMP/fazon-judge.json"
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN ANTHROPIC_PROFILE
          if [ -n "$RULE_ID" ]; then
            unset API_KEY
            if [ -z "$ORGANIZATION_ID" ] || [ -z "$SERVICE_ACCOUNT_ID" ]; then
              echo "::error::anthropic-federation-rule-id needs anthropic-organization-id and anthropic-service-account-id."
              exit 1
            fi
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "::warning::The job got no identity token (id-token: write), so the judge didn't run."
              echo "judged=no" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            token="$RUNNER_TEMP/fazon-identity-token"
            fetch() {
              curl -sSf --retry 3 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -er .value >"$token.next"
              chmod 600 "$token.next"
              mv "$token.next" "$token"
            }
            fetch
            (while sleep 60; do fetch || true; done) &
            refresher=$!
            trap 'kill "$refresher" 2>/dev/null || true' EXIT
            export ANTHROPIC_FEDERATION_RULE_ID="$RULE_ID"
            export ANTHROPIC_ORGANIZATION_ID="$ORGANIZATION_ID"
            export ANTHROPIC_SERVICE_ACCOUNT_ID="$SERVICE_ACCOUNT_ID"
            export ANTHROPIC_IDENTITY_TOKEN_FILE="$token"
            if [ -n "$WORKSPACE_ID" ]; then export ANTHROPIC_WORKSPACE_ID="$WORKSPACE_ID"; fi
          elif [ -n "$API_KEY" ]; then
            export ANTHROPIC_API_KEY="$API_KEY"
            unset API_KEY
          else
            echo "::notice::No federation rule and no anthropic-api-key secret, so the judge didn't run."
            echo "judged=no" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          code=0
          "$FAZON" judge "$RUN_ID" --json --verbose >"$result" || code=$?
          jq -r '.messages[] | "\(.level): \(.text)"' "$result" || true
          echo "judged=yes" >>"$GITHUB_OUTPUT"
          exit "$code"
      # The judge's section of `fazon report --summary`, now with its verdicts, in place of the one
      # verify wrote, in the job summary and the `fazon-report` artifact the comment posts.
      - name: Summary
        if: ${{ !cancelled() && steps.judge.outputs.judged == 'yes' }}
        run: |
          dir="$RUNNER_TEMP/fazon-report"
          part="$RUNNER_TEMP/fazon-judge-summary.md"
          section="$RUNNER_TEMP/fazon-judge-section.md"
          "$FAZON" report --summary "$RUN_ID" >"$part"
          awk '/^#### Judge$/ { on = 1 } /^<!-- fazon:artifacts -->$/ { on = 0 } on' "$part" >"$section"
          if [ -f "$dir/summary.md" ] && [ -s "$section" ]; then
            awk -v section="$section" '
              /^#### Judge$/ { while ((getline line < section) > 0) print line; skip = 1; next }
              skip && /^#### Artifacts$/ { skip = 0 }
              !skip { print }
            ' "$dir/summary.md" >"$dir/summary.next"
            mv "$dir/summary.next" "$dir/summary.md"
          fi
          { echo "## Fazon judge"; echo; sed '1d' "$section"; } >>"$GITHUB_STEP_SUMMARY"
          if "$FAZON" report --no-open "$RUN_ID"; then
            rm -rf "$dir/report"
            cp -R ".fazon/runs/$RUN_ID/report" "$dir/report"
          fi
      - name: Upload the report
        if: ${{ !cancelled() && steps.judge.outputs.judged == 'yes' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fazon-report
          path: ${{ runner.temp }}/fazon-report/
          overwrite: true
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}
      # The run with the judge's record and results; still no transcript, prompt or credential (WF-006).
      - name: Upload the run
        if: ${{ !cancelled() && steps.judge.outputs.judged == 'yes' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fazon-run
          path: |
            ${{ inputs.working-directory }}/.fazon/runs/${{ needs.verify.outputs.run }}/
            !${{ inputs.working-directory }}/.fazon/runs/${{ needs.verify.outputs.run }}/report/
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}

  # One comment, found by its marker, created or updated with the summary. Same-repository pull
  # requests only: those from forks get a read-only token. It checks out nothing and runs no code
  # from the pull request (WF-003); the summary is data.
  comment:
    name: comment
    needs: [verify, judge]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download the summary
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fazon-report
          path: ${{ runner.temp }}/fazon-report
      - name: Create or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_PAGE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ needs.verify.outputs.report-url }}
        run: |
          set -euo pipefail
          marker='<!-- fazon:summary -->'
          summary="$RUNNER_TEMP/fazon-report/summary.md"
          body="$RUNNER_TEMP/comment.md"
          # A comment holds at most 65,536 characters.
          limit=60000
          {
            echo "$marker"
            if [ ! -f "$summary" ]; then
              printf '%s\n' "## Fazon: error" "" "The verify job ended without a summary: see the [workflow run]($RUN_PAGE)."
            elif [ "$(wc -c <"$summary")" -gt "$limit" ]; then
              head -c "$limit" "$summary"
              printf '\n\n%s\n' "The summary is cut short here; the [job summary]($RUN_PAGE) has all of it."
            else
              cat "$summary"
            fi
            # The report artifact's own page: the summary is written before it's uploaded, so only
            # this job, which runs after the upload, can link it.
            if [ -n "$REPORT_URL" ]; then
              printf '\n%s\n' "Download the report and the summary: [fazon-report]($REPORT_URL)."
            fi
          } >"$body"
          jq -n --rawfile body "$body" '{body: $body}' >"$RUNNER_TEMP/comment.json"
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | awk 'NR == 1')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" --input "$RUNNER_TEMP/comment.json" >/dev/null
            echo "Updated the summary comment $id."
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" --input "$RUNNER_TEMP/comment.json" >/dev/null
            echo "Created the summary comment."
          fi
