# typos configuration (https://github.com/crate-ci/typos)
[files]
# Upstream texts kept verbatim, and the brief, which is exported and never edited to pass a check.
extend-exclude = ["LICENSE", "CODE_OF_CONDUCT.md", "CLA.md", "docs/design/brief.md"]

[default.extend-words]
# Project vocabulary that is not a typo.
fazon = "fazon"
reka = "reka"
