---
# Git hooks (https://lefthook.dev). Install with `just hooks`.
# Missing tools are skipped with a message (see scripts/with-tool.sh);
# CI runs every check with all tools installed.
# Personal overrides go in lefthook-local.yml (gitignored).

pre-commit:
  parallel: true
  jobs:
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: scripts/with-tool.sh yamllint --strict {staged_files}
    - name: markdownlint
      glob: "*.md"
      run: scripts/with-tool.sh markdownlint-cli2 {staged_files}
    - name: typos
      run: scripts/with-tool.sh typos --force-exclude {staged_files}
    - name: editorconfig
      run: scripts/with-tool.sh editorconfig-checker {staged_files}
    - name: shellcheck
      glob: "*.sh"
      run: scripts/with-tool.sh shellcheck {staged_files}
    - name: hadolint
      glob: "{*Containerfile,*Dockerfile}"
      run: scripts/with-tool.sh hadolint {staged_files}
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: scripts/with-tool.sh actionlint {staged_files}
    - name: zizmor
      glob: ".github/workflows/*.{yml,yaml}"
      run: scripts/with-tool.sh zizmor --offline --no-progress {staged_files}
    - name: pinact
      glob: ".github/workflows/*.{yml,yaml}"
      run: scripts/with-tool.sh pinact run --check {staged_files}
    - name: spec-examples
      glob: "{docs/spec/schemas/*.json,docs/spec/examples/**/*.md,docs/spec/examples/**/*.json,scripts/check-spec-examples.sh}"
      run: scripts/check-spec-examples.sh
    - name: spdx
      glob: "*.{sh,bash,ts,mts,cts,tsx,js,mjs,cjs,jsx,vue,css,html}"
      run: scripts/check-spdx.sh {staged_files}
    - name: eslint
      glob: "*.{ts,mts,cts,js,mjs,cjs}"
      run: scripts/with-deps.sh pnpm exec eslint --no-warn-ignored {staged_files}
    - name: prettier
      # The paths `pnpm format:check` (CI) covers, no more: generated JSON elsewhere keeps the layout `fazon sync` writes.
      glob: "{packages/**/*,eslint.config.js,vitest.config.ts,vitest.rendered.config.ts,package.json,pnpm-workspace.yaml,tsconfig.json,tsconfig.base.json,.prettierrc.json}"
      run: scripts/with-deps.sh pnpm exec prettier --check --ignore-unknown {staged_files}
    - name: gitleaks
      run: scripts/with-tool.sh gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: Conventional Commits header
      run: scripts/check-commit-msg.sh {1}
